name: Publish AI Mountain Man
# Free on public repos. Every hour: listen to Bluesky's public Jetstream feed for 30 minutes,
# add the counts to the published history, and redeploy GitHub Pages. Nothing is committed.
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: pages
        uses: actions/configure-pages@v5
      - name: Carry forward published history
        run: |
          mkdir -p data
          curl -fsSL "${{ steps.pages.outputs.base_url }}/data/bluesky.json" -o data/bluesky.json || rm -f data/bluesky.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install websockets==13.1
      - name: Sample Bluesky Jetstream
        continue-on-error: true
        env:
          # 30 minutes on the hourly schedule; a quick 2-minute sample on pushes and manual runs
          SAMPLE_SECONDS: ${{ github.event_name == 'schedule' && '1800' || '120' }}
        run: python sample_bluesky.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
